<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USTP Online Document Request</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap hd"><img class="logo" alt="USTP – University of Science and Technology of Southern Philippines logo" src="logo.png"><div><h1>Office of the University Registrar<br><span>Online Document Request</span></h1></div></div></header>
<div class="wrap">
<nav>
<button id="t-req" class="on">Request a Document</button>
<button id="t-trk">Track Request</button>
</nav>

<section id="v-req">
<form class="card" id="f" onsubmit="return false">
<h2>1. Student information</h2>
<div class="grid">
<div><label>Student ID *</label><input id="sid"></div>
<div><label>Full name *</label><input id="nm"></div>
<div><label>Email *</label><input id="em" type="email"></div>
<div><label>Mobile number</label><input id="ph" type="tel"></div>
<div><label>Program / Course *</label><input id="pg"></div>
<div><label>Status *</label><select id="stt"><option>Currently enrolled</option><option>Graduated</option><option>Transferee / Withdrawn</option><option>Alumni</option></select></div>
</div>
<h2 style="margin-top:20px">2. Choose document(s)</h2>
<div class="docs" id="docs"></div>
<div class="grid" style="margin-top:14px">
<div id="termBox" class="hide"><label>School year &amp; term (for grades / COR) *</label><input id="term"></div>
<div><label>Number of copies</label><input id="cp" type="number" min="1" max="10"></div>
<div><label>Purpose *</label><select id="pu"><option>Employment</option><option>Transfer to another school</option><option>Scholarship</option><option>Board exam / Licensure</option><option>Abroad / Visa</option><option>Personal copy</option><option>Other</option></select></div>
<div class="full"><label>Notes (optional)</label><textarea id="nt" rows="2"></textarea></div>
</div>
<div class="total"><button class="btn" id="sub">Submit request</button></div>
<div class="err" id="err"></div>
<div id="done" class="msg hide"></div>
</form>
</section>

<section id="v-trk" class="hide">
<div class="card"><h2>Track your request</h2>
<div class="grid"><div><label>Reference number</label><input id="ref"></div>
<div><label>Student ID</label><input id="rsid"></div></div>
<p><button class="btn" id="go">Check status</button></p><div id="tr"></div></div>
</section>

</div>
<footer>© University of Science and Technology of Southern Philippines · Demo system – requests are saved in this browser only.</footer>

<script src="script.js"></script>
</body>
</html>
